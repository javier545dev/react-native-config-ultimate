import org.gradle.util.GradleVersion
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.nio.file.Paths

if (GradleVersion.current() < GradleVersion.version('7.4')) {
    throw new GradleException(
        "react-native-config-ultimate 0.3.0+ requires Gradle 7.4 or newer. " +
        "Current: ${GradleVersion.current().version}. " +
        "Pin to react-native-config-ultimate@^0.2.0 if you cannot upgrade Gradle."
    )
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // snakeyaml 2.x fixes CVE-2022-1471 (RCE via deserialization).
        // We already use SafeConstructor(LoaderOptions), which is the 2.x-compatible pattern,
        // so the upgrade is API-compatible. See: https://snakeyaml.com/changelog.html
        classpath group: 'org.yaml', name: 'snakeyaml', version: '2.6'
    }
}


def rncuError(String msg) {
    throw new GradleException(
        "\n\n" +
        "════════════════════════════════════════════════════════════\n" +
        "  react-native-config-ultimate — Android build error\n" +
        "════════════════════════════════════════════════════════════\n" +
        "  ${msg}\n\n" +
        "  Docs: https://github.com/javier545dev/react-native-config-ultimate\n" +
        "════════════════════════════════════════════════════════════\n"
    )
}

// --- Sidecar read + divergence check ---

def libAndroidDir = buildscript.sourceFile.getParent()

def sidecarRelPath = new File(libAndroidDir, 'rncu.yaml.sha256').absolutePath
def sidecarFile = layout.projectDirectory.file(sidecarRelPath)
def sidecarText
try {
    sidecarText = providers.fileContents(sidecarFile).asText.get()
} catch (Exception e) {
    rncuError(
        "rncu.yaml.sha256 not found.\n\n" +
        "  This file is generated by the rncu CLI. Run:\n\n" +
        "    npx rncu <your-env-file>\n\n" +
        "  from your React Native project root, then retry the Android build."
    )
}

def sidecar = new JsonSlurper().parseText(sidecarText)
logger.info "[rncu] sidecar version=${sidecar.version} rncuVersion=${sidecar.rncuVersion}"

if (sidecar.version != 1) {
    rncuError(
        "Sidecar schema version ${sidecar.version} is not supported by this " +
        "Gradle script (expected 1). Upgrade react-native-config-ultimate."
    )
}

// --- Flavor mapping cross-check ---

def gradleHasFlavors = project.ext.has('flavorEnvMapping')
def sidecarHasFlavors = sidecar.flavorMapping != null

if (gradleHasFlavors != sidecarHasFlavors) {
    def gradleFlavors = gradleHasFlavors ? project.ext.get('flavorEnvMapping').keySet().sort() : '(none)'
    def cliFlavors = sidecarHasFlavors ? sidecar.flavorMapping.keySet().sort() : '(none)'
    rncuError(
        "Flavor mapping mismatch:\n\n" +
        "    build.gradle declares flavorEnvMapping = ${gradleFlavors}\n" +
        "    .rncurc.js declares flavor_env_mapping = ${cliFlavors}\n\n" +
        "  Both must declare the same set of flavor names.\n" +
        "  Update .rncurc.js or build.gradle and re-run: npx rncu"
    )
}

if (gradleHasFlavors && sidecarHasFlavors) {
    def gradleKeys = project.ext.get('flavorEnvMapping').keySet().sort()
    def cliKeys = sidecar.flavorMapping.keySet().sort()
    if (gradleKeys != cliKeys) {
        rncuError(
            "Flavor key mismatch:\n\n" +
            "    build.gradle flavorEnvMapping keys: ${gradleKeys}\n" +
            "    .rncurc.js flavor_env_mapping keys: ${cliKeys}\n\n" +
            "  Both must declare the same set of flavor names.\n" +
            "  Update .rncurc.js or build.gradle and re-run: npx rncu"
        )
    }
}

// --- Divergence check: re-hash each source .env file ---
// Sources are anchored to the RN project root (project.rootDir.parentFile).
// This matches the CLI, which writes paths relative to where `npx rncu` is run
// (the directory containing package.json — one level above android/).

def rnProjectRoot = project.rootDir.parentFile
def md = MessageDigest.getInstance('SHA-256')

def divergent = []
def missing = []

logger.info "[rncu] sidecar tracks ${sidecar.sources.size()} source(s): ${sidecar.sources.collect { it.path }.join(', ')}"

sidecar.sources.each { src ->
    def srcAbsPath = new File(rnProjectRoot, src.path).absolutePath
    def srcFile = layout.projectDirectory.file(srcAbsPath)
    def srcText
    try {
        srcText = providers.fileContents(srcFile).asText.get()
    } catch (Exception e) {
        missing << src.path
        return
    }
    def currentHash = md.digest(srcText.getBytes('UTF-8')).encodeHex().toString()
    md.reset()
    if (currentHash != src.sha256) {
        divergent << src.path
    }
}

if (!missing.isEmpty()) {
    def bullets = missing.collect { "    - ${it} (file deleted or moved)" }.join('\n')
    def fileList = missing.join(' ')
    rncuError(
        "Source env file(s) referenced in sidecar cannot be found:\n" +
        "${bullets}\n\n" +
        "  If you moved or renamed the file, re-run:\n\n" +
        "    npx rncu ${fileList}\n\n" +
        "  Then retry the Android build."
    )
}

if (!divergent.isEmpty()) {
    def bullets = divergent.collect { "    - ${it} changed" }.join('\n')
    def fileList = divergent.join(' ')
    rncuError(
        "Source env file(s) changed since the rncu CLI was last run:\n" +
        "${bullets}\n\n" +
        "  Run from your React Native project root:\n\n" +
        "    npx rncu ${fileList}\n\n" +
        "  Then retry the Android build."
    )
}

if (sidecar.sources.isEmpty()) {
    rncuError(
        "Sidecar has no sources. This is a bug — re-run npx rncu <env-file> and file an issue."
    )
}

// --- YAML read helpers (config-cache-aware) ---

def readYaml(String yamlText, String yamlPathForErrors) {
    def cfg = new org.yaml.snakeyaml.Yaml(
        new org.yaml.snakeyaml.constructor.SafeConstructor(new org.yaml.snakeyaml.LoaderOptions())
    ).load(yamlText)
    if (
        cfg instanceof String
    || cfg instanceof Integer
    || cfg instanceof Double
    || cfg instanceof Boolean
    ) {
        rncuError("rncu.yaml is not a valid key-value map (got '${cfg.class.name}'). Re-run: npx rncu .env")
    } else if (cfg == null) {
        rncuError("rncu.yaml is empty. Re-run: npx rncu .env")
    }
    return cfg
}

def buildRootConfig() {
    def flavorMappingExists = project.ext.has('flavorEnvMapping')
    if (flavorMappingExists) {
        def config = [:]
        def flavorMapping = project.ext.get('flavorEnvMapping')
        logger.info "[rncu] Flavor mapping detected: ${flavorMapping.keySet()}"
        flavorMapping.each { flavor, yamlPath ->
            def absolutePath = new File(project.rootDir.getAbsolutePath(), yamlPath).absolutePath
            def yamlFile = layout.projectDirectory.file(absolutePath)
            def yamlText
            try {
                yamlText = providers.fileContents(yamlFile).asText.get()
            } catch (Exception e) {
                rncuError(
                    "rncu YAML for flavor '${flavor}' not found at:\n" +
                    "    ${absolutePath}\n\n" +
                    "  Run: npx rncu"
                )
            }
            config.put(flavor, readYaml(yamlText, absolutePath))
        }
        return config
    } else {
        logger.info "[rncu] No flavor mapping detected. Reading injected file"
        def yamlAbsPath = new File(libAndroidDir, 'rncu.yaml').absolutePath
        def yamlFile = layout.projectDirectory.file(yamlAbsPath)
        def yamlText
        try {
            yamlText = providers.fileContents(yamlFile).asText.get()
        } catch (Exception e) {
            rncuError(
                "rncu.yaml not found at:\n" +
                "    ${yamlAbsPath}\n\n" +
                "  This file is generated by the rncu CLI. It is missing\n" +
                "  because you have not run rncu yet (or ran npm install\n" +
                "  after the last rncu run, which resets the file)."
            )
        }
        return readYaml(yamlText, yamlAbsPath)
    }
}

def flattenConfig(cfg) {
    def result = [:]
    cfg.each { k,v ->
        if (
            v instanceof String
        || v instanceof Integer
        || v instanceof Double
        || v instanceof Boolean
        ) {
            result.put(k,v)
        } else {
            def androidValue = v.get("android")
            if (androidValue == null) {
                throw new GradleException("key ${k} is missing android value")
            }
            result.put(k, v.get("android"))
        }
    }
    return result
}

def rootConfig = buildRootConfig()
logger.info "[rncu] Config loaded with ${rootConfig instanceof Map ? rootConfig.size() : 'N/A'} keys"

def configPerFlavor(flavorName, rootConfig) {
    def mapping = project.ext.has('flavorEnvMapping')
    if (mapping && !flavorName.isEmpty()) {
        logger.info "[rncu] Using flavor mapping for '${flavorName}'"
        def f = rootConfig.get(flavorName)
        return f
    } else {
        logger.info "[rncu] No flavor mapping — using root config"
        return rootConfig
    }
}

def escape_double(str) {
    return str.replace('\\', '\\\\').replace('"', '\\"')
}
def escape_single(str) {
    return str.replace('\\', '\\\\').replace("'", "\\'")
}

android {
    // We use applicationVariants.all (the legacy variant API) on purpose:
    // it does exactly what an env-var injector needs — write simple
    // BuildConfig fields and resValues per variant — and works across
    // AGP 7, 8, and 9. The newer androidComponents.onVariants API exists
    // for plugins that manipulate the variant lifecycle or inject typed
    // values, which is overkill here and additionally fails to compile
    // when loaded via `apply from:` (its types are not on the script's
    // classpath). If AGP eventually removes this API, revisit then.
    applicationVariants.all { variant ->
        logger.info "[rncu] processing variant ${variant.name}"
        def flavorName = variant.flavorName

        def cfg = flattenConfig(configPerFlavor(flavorName, rootConfig))
        def keySet = cfg.keySet().collect()
        logger.info "[rncu] variant '${variant.name}': ${keySet.size()} keys [${keySet.join(', ')}]"
        def rncuKeys = java.lang.String.join(",", keySet)
        variant.buildConfigField "String", "__RNCU_KEYS", "\"${rncuKeys}\""

        // manifestPlaceholders injection is DEFAULT-ON (restores pre-0.2.1 behavior).
        // Set project.ext.rncuManifestPlaceholders = false to opt out (rare; only needed
        // if your env-var names collide with reserved manifest placeholder names).
        def manifestEnabled = !(project.ext.has('rncuManifestPlaceholders') && project.ext.get('rncuManifestPlaceholders') == false)
        if (project.ext.has('rncuManifestPlaceholders') && project.ext.get('rncuManifestPlaceholders') == true) {
            logger.warn "[rncu] project.ext.rncuManifestPlaceholders = true is now the default in 0.3.0 — you can remove this line from build.gradle."
        }
        if (manifestEnabled) {
            variant.mergedFlavor.manifestPlaceholders.putAll(cfg)
        } else {
            logger.info "[rncu] manifestPlaceholders injection disabled by rncuManifestPlaceholders=false"
        }

        cfg.each { k, v ->
            if (v instanceof java.lang.String) {
                variant.buildConfigField "String", k, "\"${escape_double(v)}\""
                variant.resValue "string", k, "${escape_single(v)}"
            } else if (v instanceof Integer) {
                variant.buildConfigField "int", k, "${v}"
                variant.resValue "integer", k, "${v}"
            } else if (v instanceof Double) {
                variant.buildConfigField "double", k, "${v}"
                variant.resValue "string", k, "${v}"
            } else if (v instanceof Boolean) {
                variant.buildConfigField "boolean", k, "${v}"
                variant.resValue "bool", k, "${v}"
            } else {
                throw new GradleException("unknown type for key ${k} in flavor ${flavorName}: ${v.getClass()}")
            }
        }
    }
    defaultConfig {
        project.ext.set("config", rootConfig)
    }
}
