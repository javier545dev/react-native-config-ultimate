name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published (for reference only)"
        required: false
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # npm Trusted Publishing (token-less OIDC auth) requires npm >= 11.5.1.
      # Node 22.x ships with npm 10.x by default, which knows how to sign
      # provenance but not how to exchange the OIDC token for an npm publish
      # credential — so the PUT to the registry would fail with 404 ("not
      # authorized") despite the OIDC signature being valid.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Copy LICENSE and README to package
        run: cp LICENSE README.md packages/react-native-config-ultimate/

      # Authentication via npm Trusted Publishing (OIDC):
      # the workflow exchanges its OIDC token for an npm publish token at runtime,
      # so no NPM_TOKEN secret is needed. Configured at
      # https://www.npmjs.com/package/react-native-config-ultimate/access
      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/react-native-config-ultimate
