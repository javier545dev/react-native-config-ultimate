name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published (for reference only)"
        required: false
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Copy LICENSE and README to package
        run: cp LICENSE README.md packages/react-native-config-ultimate/

      # Authentication via npm Trusted Publishing (OIDC):
      # the workflow exchanges its OIDC token for an npm publish token at
      # runtime, so no NPM_TOKEN secret is needed. Configured at
      # https://www.npmjs.com/package/react-native-config-ultimate/access
      #
      # We invoke npm@latest via npx instead of the system npm because Trusted
      # Publishing requires npm >= 11.5.1; Node 22.x ships with npm 10.x. Using
      # npx avoids the well-known `npm install -g npm@latest` self-upgrade bug
      # (Cannot find module 'promise-retry' mid-install) by running the new
      # npm as a transient tool only for this step.
      - name: Publish to npm with npm@latest
        run: npx -y npm@latest publish --access public --provenance
        working-directory: packages/react-native-config-ultimate
