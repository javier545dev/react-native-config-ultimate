name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published (for reference only)"
        required: false
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Node 24 ships with npm >= 11.5.1, which is the minimum the npm CLI
      # needs to exchange GitHub Actions' OIDC token for an npm publish
      # credential (Trusted Publishing). Earlier Node majors ship with npm 10,
      # which signs provenance but cannot complete the OIDC token exchange and
      # falls back to looking for NODE_AUTH_TOKEN — leading to a misleading
      # 404 from the registry when no token is present.
      #
      # Per npm docs, release builds should also disable dependency caching to
      # avoid any chance of cache-poisoning a published artifact.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Copy LICENSE and README to package
        run: cp LICENSE README.md packages/react-native-config-ultimate/

      # Authentication via npm Trusted Publishing (OIDC).
      # The npm CLI auto-detects the GitHub Actions OIDC environment and
      # exchanges the id-token for a short-lived publish credential — no
      # NPM_TOKEN secret is needed. Provenance attestation is also generated
      # via the same OIDC flow. Trusted publisher is configured at
      # https://www.npmjs.com/package/react-native-config-ultimate/access
      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/react-native-config-ultimate
