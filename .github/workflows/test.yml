name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
    tags-ignore:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  # Smoke-test the rncu Gradle plugin against the example app on every PR.
  # The example app is intentionally excluded from the pnpm workspace and
  # consumes the published npm version, so we pack the freshly built library
  # and install it into the example's node_modules before running Gradle —
  # otherwise CI would only validate the already-published code, not this PR.
  # Targets the dedicated generateDebug{BuildConfig,ResValues} tasks (no
  # native compilation, no manifest merger) to keep the job fast.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      # The example app is excluded from the pnpm workspace, so its
      # node_modules is not populated by the root `pnpm install`. Install
      # its dependencies separately. The example has no committed lockfile
      # (see #31), so use --no-frozen-lockfile.
      - name: Install example dependencies
        working-directory: packages/example
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Pack library and install into example
        run: |
          mkdir -p /tmp/rncu-pack
          pnpm --filter react-native-config-ultimate pack --pack-destination=/tmp/rncu-pack
          rm -rf packages/example/node_modules/react-native-config-ultimate
          tar -xzf /tmp/rncu-pack/react-native-config-ultimate-*.tgz \
            -C packages/example/node_modules/
          mv packages/example/node_modules/package \
            packages/example/node_modules/react-native-config-ultimate

      - name: Generate rncu output for example app
        working-directory: packages/example
        run: node node_modules/react-native-config-ultimate/lib/commonjs/cli.js .env.yaml

      - name: Validate Android plugin (BuildConfig + resValues)
        working-directory: packages/example/android
        run: ./gradlew :app:generateDebugBuildConfig :app:generateDebugResValues --warning-mode=summary

      - name: Assert BuildConfig contains rncu keys
        working-directory: packages/example
        run: |
          BUILD_CONFIG=$(find android/app/build/generated/source/buildConfig -name BuildConfig.java | head -1)
          if [ -z "$BUILD_CONFIG" ]; then echo "BuildConfig.java not generated"; exit 1; fi
          grep -q "__RNCU_KEYS" "$BUILD_CONFIG" || { echo "__RNCU_KEYS missing from BuildConfig"; exit 1; }
          grep -q "API_URL" "$BUILD_CONFIG" || { echo "API_URL missing from BuildConfig"; exit 1; }
          echo "✓ BuildConfig contains expected rncu fields"

      - name: Assert resValues injected
        working-directory: packages/example
        run: |
          RES_XML=$(find android/app/build/generated -name "gradleResValues.xml" | head -1)
          if [ -z "$RES_XML" ]; then echo "gradleResValues.xml not generated"; exit 1; fi
          grep -q 'name="API_URL"' "$RES_XML" || { echo "API_URL resValue missing"; exit 1; }
          echo "✓ resValues contain expected rncu entries"
