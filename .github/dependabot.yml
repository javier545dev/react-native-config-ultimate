version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # React and React Native are peer deps — let consumers drive these bumps.
      - dependency-name: react
      - dependency-name: react-native
      # @react-native-community/cli surfaces a critical alert
      # (GHSA-399j-vxmf-hjvr, OS command injection) only inside packages/Example079,
      # the demo app pinned to RN 0.79.5 that we keep around to validate the
      # library on Old Architecture. The CLI is a dev-time tool that never reaches
      # the published library, so the vulnerability does not affect consumers of
      # react-native-config-ultimate. Bumping it to a patched major would break
      # the RN 0.79 setup we intentionally preserve, so we silence the noise here.
      - dependency-name: "@react-native-community/cli"
      - dependency-name: "@react-native-community/cli-server-api"
      - dependency-name: "@react-native-community/cli-platform-ios"
      - dependency-name: "@react-native-community/cli-platform-android"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
